events {
  worker_connections 1024;
}

http {
  upstream betterbase_server {
    server betterbase-server:3001;
  }

  upstream betterbase_dashboard {
    server betterbase-dashboard:80;
  }

  upstream minio {
    server minio:9000;
  }

  upstream inngest {
    server inngest:8288;
  }

  server {
    listen 80;
    server_name _;

    # Inngest dashboard (self-hosted only) - protected by IP restriction
    # To enable HTTP basic auth in production:
    #   1. Generate htpasswd: htpasswd -bc /etc/nginx/.htpasswd admin <password>
    #   2. Uncomment auth_basic and auth_basic_user_file below
    location /inngest/ {
      rewrite ^/inngest/(.*) /$1 break;
      proxy_pass http://inngest;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # IP-based access control - restricts to internal networks only
      # Current protection: allow from 10.x, 172.16-31.x, 192.168.x ranges
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
    }

    # Inngest function serve endpoint (cloud callbacks)
    location /api/inngest {
      proxy_pass http://betterbase_server;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 300s;
    }

    # API + admin + device auth
    location /admin/ {
      proxy_pass http://betterbase_server;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location /device/ {
      proxy_pass http://betterbase_server;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://betterbase_server;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Storage (MinIO)
    location /storage/ {
      rewrite ^/storage/(.*) /$1 break;
      proxy_pass http://minio;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 100m;
    }

    # Dashboard (catch-all)
    location / {
      proxy_pass http://betterbase_dashboard;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      # SPA fallback
      proxy_intercept_errors on;
      error_page 404 = @dashboard_fallback;
    }

    location @dashboard_fallback {
      proxy_pass http://betterbase_dashboard;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket support for realtime
    location /realtime/ {
      proxy_pass http://betterbase_server;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }
  }
}