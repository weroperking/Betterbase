# .coderabbit.yaml
# BetterBase CodeRabbit Configuration
# Stack: Bun + Hono + Drizzle + BetterAuth + Turborepo monorepo

language: "en-US"
tone_instructions: "Direct, technical. Flag real issues only. Prioritize security, correctness, and architectural consistency over style."

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  sequence_diagrams: true

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/.turbo/**"
    - "!**/*.lock"
    - "!**/coverage/**"
    - "!**/.betterbase-context.json"

  path_instructions:
    - path: "packages/server/**"
      instructions: |
        Self-hosted BetterBase server. Security invariants:
        - All /admin/* routes (except /admin/auth/login/setup/logout) require requireAdmin middleware
        - /admin/auth/setup returns 410 if any admin exists (one-time bootstrap)
        - Admin keys SHA-256 hashed before storage, plaintext returned once only
        - JWT uses HS256 via jose, BETTERBASE_JWT_SECRET >= 32 chars
        - bcrypt rounds = 12
        - API key prefix: bb_live_, last_used_at is fire-and-forget
        - betterbase_meta.audit_log: write-only, no update/delete routes ever
        - All Postgres queries use singleton pool from db.ts
        - Migrations: NNN_description.sql format, idempotent, no gaps
        - Per-project schemas: project_{slug} with pg parameterized queries
        - Request logging: fire-and-forget (.catch(() => {}))
        - Audit log writes: fire-and-forget
        - Webhook delivery log (logWebhookDelivery): awaited
        - Function invocation log (logFunctionInvocation): awaited
        - Hono routes: validate with @hono/zod-validator, don't throw in handlers

    - path: "packages/cli/**"
      instructions: |
        CLI package. Critical invariants:
        - init MUST be in PUBLIC_COMMANDS (["login", "init", "--version", "--help", "-V", "-h"])
        - Never use "bun" string in spawn() - use process.execPath
        - All authenticated commands use apiRequest() from utils/api-client.ts
        - Credentials at ~/.betterbase/credentials.json with mode 0o700/0o600
        - login uses OAuth 2.0 device flow (POST /device/code → browser → poll /device/token)

    - path: "packages/core/**"
      instructions: |
        @betterbase/core engine. Invariants:
        - All DB queries type-safe through Drizzle, raw SQL only in migrations/RLS
        - Relations defined with drizzle-orm relations()
        - Auth schema tables match BetterAuth adapter expectations
        - RLS via definePolicy() only
        - auth.uid() required before RLS policies
        - S3 adapter uses forcePathStyle: true
        - WebSocket via Bun native API, polling over SSE for log streams

    - path: "packages/client/**"
      instructions: |
        Client SDK. Invariants:
        - All async operations return { data, error }, never throw
        - QueryBuilder is chainable and lazy (.execute() triggers call)
        - OAuth redirects, doesn't return data
        - getPublicUrl() is sync, createSignedUrl() is async
        - Realtime: WebSocket with exponential backoff reconnection

    - path: "packages/shared/**"
      instructions: |
        Shared types. Invariants:
        - Backward-compatible types only (additive changes)
        - Error classes extend BetterBaseError
        - IDs use nanoid, never Math.random() or Date.now()

    - path: "apps/dashboard/**"
      instructions: |
        React admin dashboard. Stack: React Router v7, TanStack Query v5, Tailwind CSS v4, shadcn/ui.
        Invariants:
        - All server calls via src/lib/api.ts
        - Query keys from src/lib/query-keys.ts (QK factory)
        - staleTime: 30s default, refetchInterval: 30s for metrics/health
        - useMutation onSuccess: queryClient.invalidateQueries(QK.key)
        - Forms: React Hook Form + Zod resolver
        - Destructive actions: ConfirmDialog with typed resource name
        - Colors: CSS variables only (var(--color-*))
        - Empty/Loading states required for list views
        - AuthGuard uses localStorage bb_token, redirects to /login
        - Query params: useSearchParams, not useState

    - path: "packages/server/migrations/**"
      instructions: |
        Migration invariants:
        - Naming: NNN_description.sql (sequential, no gaps)
        - Idempotent: use IF NOT EXISTS / IF EXISTS guards
        - No DROP without explicit comment on data loss
        - No ALTER COLUMN breaking backward compatibility
        - CREATE INDEX IF NOT EXISTS for indexes
        - betterbase_meta schema prefix on all tables
        - pgcrypto extension before gen_random_uuid()

    - path: "docker-compose.self-hosted.yml"
      instructions: |
        Docker compose invariants:
        - BETTERBASE_JWT_SECRET uses :? syntax (fail fast if unset)
        - Service order: postgres+minio healthy → server → dashboard → nginx
        - All services on betterbase-internal network
        - Named volume mounts for postgres/minio
        - server DATABASE_URL uses internal service name (postgres)

    - path: "docker/**"
      instructions: |
        Nginx config invariants:
        - /admin/* and /device/* proxy to betterbase-server:3001
        - /storage/* proxy to minio:9000 with rewrite
        - / catch-all to betterbase-dashboard:80 with SPA fallback
        - /realtime/* needs WebSocket upgrade headers
        - client_max_body_size >= 100m

auto_review:
  enabled: true
  drafts: false
  base_branches: ["main", "develop"]

finishing_touches:
  docstrings:
    enabled: false

  generate_agent_prompt:
    enabled: true
    prompt: |
      ## Kilo Code — Full Agent Prompt (All Issues This Review)

      You are Kilo Code on the BetterBase monorepo. Address ALL issues flagged.

      ### Context
      - Runtime: Bun (use process.execPath, never "bun" string)
      - Framework: Hono (server), React Router v7 (dashboard)
      - ORM: Drizzle (type-safe, raw SQL in migrations only)
      - CLI: init in PUBLIC_COMMANDS, API calls via apiRequest()

      ### Critical Invariants
      1. /admin/auth/setup returns 410 if admin exists
      2. Admin keys SHA-256 hashed before storage
      3. betterbase_meta.audit_log: no update/delete routes
      4. Webhook delivery log awaited, request logs fire-and-forget
      5. Dashboard colors: CSS variables only
      6. Dashboard API calls via src/lib/api.ts

      ### Issues to Fix
      {{review_issues}}

      ### Instructions
      1. Read every flagged file before editing
      2. Fix in dependency order (server → CLI → client)
      3. Verify migration sequence has no gaps
      4. Verify requireAdmin present on server /admin routes
      5. Verify PUBLIC_COMMANDS contains init after CLI edits
      6. Run typecheck on modified packages

  generate_agent_prompt_critical:
    enabled: true
    severity_filter: "critical"
    prompt: |
      ## CRITICAL Issues — Must Fix Before Merge

      Critical = security breach, data loss, auth bypass, broken deployments,
      audit log mutation, hardcoded credentials.

      {{critical_issues}}

      ### Fix Protocol
      1. Stop other work
      2. Fix security first, add regression test
      3. Never edit applied migrations — create new
      4. Add missing middleware, trace all routes in file
      5. Delete audit log mutation routes
      6. Commit fixes in isolation

  generate_agent_prompt_major:
    enabled: true
    severity_filter: "major"
    prompt: |
      ## MAJOR Issues — Must Fix Before Merge

      Major = incorrect behavior, broken self-hosted compatibility,
      fire-and-forget/await confusion, raw fetch() in dashboard,
      missing provision_project_schema().

      {{major_issues}}

      ### Fix Protocol
      - Replace fetch() with api.get/post/patch/delete from src/lib/api.ts
      - Add queryClient.invalidateQueries() in useMutation onSuccess
      - Use process.execPath in CLI spawn calls
      - Add requireAdmin middleware to missed routes

  generate_agent_prompt_minor:
    enabled: true
    severity_filter: "minor"
    prompt: |
      ## MINOR Issues — Fix in This PR

      Minor = style drift, missing types, magic numbers, unused imports,
      CSS variable inconsistency, spec/doc mismatch.

      {{minor_issues}}

      ### Fix Protocol
      1. Fix all in single commit
      2. Extract magic numbers to named constants
      3. Add `// Fire-and-forget — intentional` comments
      4. Remove unused imports
      5. Align specs with implementation

chat:
  auto_reply: true

knowledge_base:
  learnings: { scope: auto }
  issues: { scope: auto }
  opt_out: false